name: host

on:
  push:
    branches: [main]
    paths: [host/**, protocol/**, deploy/docker/**, .github/workflows/host.yml]
  pull_request:
    paths: [host/**, protocol/**, deploy/docker/**, .github/workflows/host.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: host
    shell: bash

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu, os: ubuntu-latest}
          - {name: windows, os: windows-latest}
          - {name: macos, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: smoke test
        run: |
          go build -o bin/ ./cmd/...
          bin/buddyd version
          bin/buddyctl version
          bin/buddysim --version

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: "7"}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        run: |
          ver="0.1.0-dev+${GITHUB_SHA::7}"
          ldflags="-s -w -X main.version=$ver"

          # Build all commands normally for the selected platform.
          go build -trimpath -ldflags "$ldflags" -o dist/ ./cmd/...

          # Replace only Windows buddyd with a console-free executable.
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath \
              -ldflags "$ldflags -H=windowsgui" \
              -o dist/buddyd.exe \
              ./cmd/buddyd
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: buddy-host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: host/dist/
          retention-days: 14

  # The image isn't published: deploy/docker/compose.yml builds it from the repository.
  docker:
    name: docker image (Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: compose file
        run: docker compose -f ../deploy/docker/compose.yml config -q
      - name: build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: host
          load: true
          tags: buddyd:test
          build-args: VERSION=0.1.0-dev+${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: end-to-end test (emulated device → buddyd in the container)
        run: |
          docker run -d --name buddyd -p 7531:7531 buddyd:test
          go build -o bin/ ./cmd/buddysim
          bin/buddysim device --host 127.0.0.1:7531 --nvs /tmp/sim.json --http 127.0.0.1:7600 &
          for i in $(seq 30); do
            if docker exec buddyd buddyctl devices | grep -q '"dev": "buddy-sim01"'; then ok=1; break; fi
            sleep 1
          done
          docker exec buddyd buddyctl devices
          docker logs buddyd
          [ -n "${ok:-}" ] || { echo "device did not connect"; exit 1; }
          docker exec buddyd buddyctl version
