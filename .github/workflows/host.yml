name: host

on:
  push:
    branches: [main]
    paths: [host/**, protocol/**, deploy/docker/**, .github/workflows/host.yml]
  pull_request:
    paths: [host/**, protocol/**, deploy/docker/**, .github/workflows/host.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: host
    shell: bash

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu, os: ubuntu-latest}
          - {name: windows, os: windows-latest}
          - {name: macos, os: macos-latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'ed:"; echo "$out"; exit 1; fi
      - name: go mod tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: smoke test
        run: |
          go build -o bin/ ./cmd/...
          bin/buddy-link version
          bin/buddy-ctl version
          bin/buddy-sim --version
      - name: Windows GUI build (no console window) still prints to a terminal or pipe
        if: runner.os == 'Windows'
        run: |
          go build -ldflags "-H=windowsgui" -o bin/buddy-link-gui.exe ./cmd/buddy-link
          bin/buddy-link-gui.exe version | tee out.txt
          grep -q "^buddy-link " out.txt
      - name: Buddy Link.app (macOS)
        if: runner.os == 'macOS'
        run: scripts/macos-app.sh "0.0.0-dev+${GITHUB_SHA::7}" dist
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: buddy-link-macos-app
          path: host/dist/Buddy-Link-macos-universal.zip
          retention-days: 14

  # golangci-lint with host/.golangci.yml. On pull requests only the lines they change count,
  # so older code doesn't block a change.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: host
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: "7"}
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        run: |
          ver="0.1.0-dev+${GITHUB_SHA::7}"
          ldflags="-s -w -X main.version=$ver"

          # Build all commands normally for the selected platform.
          go build -trimpath -ldflags "$ldflags" -o dist/ ./cmd/...

          # Replace only Windows buddy-link with a console-free executable.
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath \
              -ldflags "$ldflags -H=windowsgui" \
              -o dist/buddy-link.exe \
              ./cmd/buddy-link
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: buddy-link-${{ matrix.goos }}-${{ matrix.goarch }}
          path: host/dist/
          retention-days: 14

  # The image isn't published: deploy/docker/compose.yml builds it from the repository.
  docker:
    name: docker image (Compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: compose file
        run: docker compose -f ../deploy/docker/compose.yml config -q
      - name: build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: host
          load: true
          tags: buddy-link:test
          build-args: VERSION=0.1.0-dev+${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: end-to-end test (emulated device → buddy-link in the container)
        run: |
          docker run -d --name buddy-link -p 7531:7531 buddy-link:test
          go build -o bin/ ./cmd/buddy-sim
          bin/buddy-sim device --host 127.0.0.1:7531 --nvs /tmp/sim.json --http 127.0.0.1:7600 &
          for i in $(seq 30); do
            if docker exec buddy-link buddy-ctl devices | grep -q '"dev": "buddy-sim01"'; then ok=1; break; fi
            sleep 1
          done
          docker exec buddy-link buddy-ctl devices
          docker logs buddy-link
          [ -n "${ok:-}" ] || { echo "device did not connect"; exit 1; }
          docker exec buddy-link buddy-ctl version
