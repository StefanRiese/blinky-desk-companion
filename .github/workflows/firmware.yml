name: firmware

on:
  push:
    branches: [main]
    paths: [firmware/**, protocol/**, .github/workflows/firmware.yml]
  pull_request:
    paths: [firmware/**, protocol/**, .github/workflows/firmware.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: simulator + host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SDL2 and Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev ninja-build
      - name: build
        run: |
          cmake -S firmware/sim -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: host tests
        run: ctest --test-dir build --output-on-failure
      - name: screenshots
        run: mkdir -p shots && build/buddy_shot shots
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-screenshots
          path: shots/
          retention-days: 14

  esp32:
    name: ESP32-S3 firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        board: [ws146, amoled175]
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout (the build reads the version from git)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: /
      - name: build
        run: |
          . "$IDF_PATH/export.sh"
          b="build-${{ matrix.board }}"
          idf.py -B "$b" -D BOARD=${{ matrix.board }} set-target esp32s3
          idf.py -B "$b" -D BOARD=${{ matrix.board }} build
          idf.py -B "$b" merge-bin -o blinky-firmware-${{ matrix.board }}.bin
          ls -la "$b"/*.bin
          idf.py -B "$b" size
      - name: dependencies.lock (commit it when it changes)
        run: cat dependencies.lock
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build-${{ matrix.board }}/blinky-firmware-${{ matrix.board }}.bin
            firmware/dependencies.lock
          retention-days: 14
