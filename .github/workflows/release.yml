name: release

# Push a tag like v0.1.0 to build all programs for all platforms and the ESP32 firmware, and
# publish a GitHub release. deploy/proxmox/buddyd-lxc.sh downloads buddyd-linux-<arch> from
# the latest one; the pages workflow puts the newest firmware on the setup page.
# Started by hand (Actions → release → Run workflow) it only builds and uploads the files
# as a workflow artifact, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # buddyd for macOS shows its menu bar icon through Cocoa, which needs cgo and so a Mac.
  # Both architectures are built here and joined with lipo; the other macOS programs
  # need no cgo and are cross-compiled in the release job.
  macos:
    name: buddyd for macOS (menu bar)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="0.0.0-dev+${GITHUB_SHA::7}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$ver" -o "dist/buddyd-$arch" ./cmd/buddyd
          done
          lipo -create -output dist/buddyd-macos-universal dist/buddyd-amd64 dist/buddyd-arm64
          rm dist/buddyd-amd64 dist/buddyd-arm64
          lipo -info dist/buddyd-macos-universal
          dist/buddyd-macos-universal version
      - uses: actions/upload-artifact@v7
        with:
          name: buddyd-macos
          path: host/dist/buddyd-macos-universal
          retention-days: 1

  # The ESP32 firmware as one image to flash at offset 0 (what the setup page installs).
  firmware:
    name: firmware (ws146)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: /
      - name: build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="0.0.0-dev+${GITHUB_SHA::7}"
          echo "$ver" > version.txt # the firmware's version (esp_app_desc), instead of git describe
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o blinky-firmware-ws146.bin
          ls -la build/blinky-firmware-ws146.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/build/blinky-firmware-ws146.bin
          retention-days: 1

  release:
    needs: [macos, firmware]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test -count=1 ./...
      - name: build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="0.0.0-dev+${GITHUB_SHA::7}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}" ext="" name="${target%/*}"
            [ "$os" = windows ] && ext=".exe"
            [ "$os" = darwin ] && name=macos # Go calls macOS "darwin"
            for cmd in buddyd buddyctl; do # buddysim (emulator) is for development: build it from source
              [ "$os/$cmd" = darwin/buddyd ] && continue # built on macOS (job macos)
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build -trimpath \
                -ldflags "-s -w -X main.version=$ver" -o "dist/$cmd-$name-$arch$ext" "./cmd/$cmd"
            done
          done
          # One file for Intel and Apple Silicon Macs (lipo only exists on macOS; makefat is
          # a pure-Go equivalent).
          for cmd in buddyctl; do
            go run github.com/randall77/makefat@v0.0.0-20260406194835-1b91746796b7 \
              "dist/$cmd-macos-universal" "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64"
            info="$(file "dist/$cmd-macos-universal")"
            echo "$info"
            grep -q "universal binary with 2 architectures" <<<"$info"
            rm "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64" # only the universal file is published
          done
      - uses: actions/download-artifact@v8
        with:
          name: buddyd-macos
          path: host/dist
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: host/dist
      - name: checksums
        run: |
          chmod +x dist/buddyd-macos-universal # artifacts don't keep the file mode
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: upload (test run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-test
          path: host/dist/
          retention-days: 7
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release text: this tag's section of CHANGELOG.md, else GitHub's generated notes.
          # "(pre-release)" in the section's heading publishes a pre-release, which doesn't
          # become "latest" (the Proxmox script installs the latest regular release).
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p = ($2 == tag); next} p' ../CHANGELOG.md > notes.md
          flags=()
          if grep -Eq "^## $GITHUB_REF_NAME .*\(pre-release\)" ../CHANGELOG.md; then flags+=(--prerelease); fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Blinky $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Blinky $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
