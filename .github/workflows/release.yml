name: release

# Push a tag like v0.1.0 to build all programs for all platforms and the ESP32 firmware, and
# publish a GitHub release. deploy/proxmox/buddy-link-lxc.sh downloads buddy-link-linux-<arch> from
# the latest one; the pages workflow puts the newest firmware on the setup page.
# Every push to main publishes the same files as the rolling pre-release latest-main
# ("Latest build from main"), replaced each time; Buddy Link offers it for flashing and
# updates, the setup page and the Proxmox script ignore it.
# Started by hand (Actions → release → Run workflow) it only builds and uploads the files
# as a workflow artifact, without publishing anything.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: # for main only (tags ignore path filters)
      - "firmware/**"
      - "host/**"
      - "protocol/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# A newer push to main replaces the build of an older one; tags always run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: write
  actions: write # start the pages workflow (puts the new firmware on the setup page)

jobs:
  # The version of this build: the tag (v0.2.0 → 0.2.0), or for main the next patch version
  # as a pre-release, 0.2.1-dev.<commits since v0.2.0>+<commit>, so it sorts after the last
  # release and before the next one.
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            n=$(git rev-list --count "$last"..HEAD)
            IFS=. read -r major minor patch <<<"${last#v}"
            ver="$major.$minor.$((${patch%%[-+]*} + 1))-dev.$n+${GITHUB_SHA::7}"
          fi
          echo "version $ver"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

  # Buddy Link.app for macOS: buddy-link's menu bar icon needs cgo (Cocoa) and so a Mac. The app
  # holds buddy-link for Intel and Apple Silicon and the icon (host/scripts/macos-app.sh).
  # buddy-ctl needs no cgo and is cross-compiled in the release job.
  macos:
    name: Buddy Link.app (macOS)
    needs: version
    runs-on: macos-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - name: build
        run: |
          ver="${{ needs.version.outputs.ver }}"
          scripts/macos-app.sh "$ver" dist
      - uses: actions/upload-artifact@v7
        with:
          name: buddy-link-macos
          path: host/dist/Buddy-Link-macos-universal.zip
          retention-days: 1

  # The ESP32 firmware per board: the whole image to flash at offset 0 (what the setup page and
# buddy-link's "Flash a new device" install) and the app alone (updates).
  firmware:
    name: firmware (${{ matrix.board }})
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      matrix:
        board: [ws146, amoled175]
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        working-directory: /
      - name: build
        run: |
          ver="${{ needs.version.outputs.ver }}"
          echo "$ver" > version.txt # the firmware's version (esp_app_desc), instead of git describe
          . "$IDF_PATH/export.sh"
          b="build-${{ matrix.board }}"
          idf.py -B "$b" -D BOARD=${{ matrix.board }} set-target esp32s3
          idf.py -B "$b" -D BOARD=${{ matrix.board }} build
          idf.py -B "$b" merge-bin -o blinky-firmware-${{ matrix.board }}.bin
          # The app alone, for updates over the link (buddy-link) and over WiFi.
          cp "$b/deskbuddy.bin" "$b/blinky-app-${{ matrix.board }}.bin"
          ls -la "$b/blinky-firmware-${{ matrix.board }}.bin" "$b/blinky-app-${{ matrix.board }}.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build-${{ matrix.board }}/blinky-firmware-${{ matrix.board }}.bin
            firmware/build-${{ matrix.board }}/blinky-app-${{ matrix.board }}.bin
          retention-days: 1

  release:
    needs: [version, macos, firmware]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test -count=1 ./...
      - name: build
        run: |
          ver="${{ needs.version.outputs.ver }}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}" ext="" name="${target%/*}"
            [ "$os" = windows ] && ext=".exe"
            [ "$os" = darwin ] && name=macos # Go calls macOS "darwin"
            for cmd in buddy-link buddy-ctl; do # buddy-sim (emulator) is for development: build it from source
              [ "$os/$cmd" = darwin/buddy-link ] && continue # Buddy Link.app, built on macOS (job macos)
              gui="" # buddy-link.exe is a GUI program: no console window, only the tray icon
              [ "$os/$cmd" = windows/buddy-link ] && gui="-H=windowsgui"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build -trimpath \
                -ldflags "-s -w $gui -X main.version=$ver" -o "dist/$cmd-$name-$arch$ext" "./cmd/$cmd"
            done
          done
          # One file for Intel and Apple Silicon Macs (lipo only exists on macOS; makefat is
          # a pure-Go equivalent).
          for cmd in buddy-ctl; do
            go run github.com/randall77/makefat@v0.0.0-20260406194835-1b91746796b7 \
              "dist/$cmd-macos-universal" "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64"
            info="$(file "dist/$cmd-macos-universal")"
            echo "$info"
            grep -q "universal binary with 2 architectures" <<<"$info"
            rm "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64" # only the universal file is published
          done
      - uses: actions/download-artifact@v8
        with:
          name: buddy-link-macos
          path: host/dist
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          merge-multiple: true
          path: host/dist
      - name: checksums
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)
      - name: upload (test run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-test
          path: host/dist/
          retention-days: 7
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release text: this tag's section of CHANGELOG.md, else GitHub's generated notes.
          # "(pre-release)" in the section's heading publishes a pre-release, which doesn't
          # become "latest" (the Proxmox script installs the latest regular release).
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p = ($2 == tag); next} p' ../CHANGELOG.md > notes.md
          flags=()
          if grep -Eq "^## $GITHUB_REF_NAME .*\(pre-release\)" ../CHANGELOG.md; then flags+=(--prerelease); fi
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Blinky $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Blinky $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
          # A release made with the workflow token doesn't trigger other workflows, so start
          # the setup page deployment here (workflow_dispatch is allowed).
          gh workflow run pages.yml --ref main
      - name: publish the latest build from main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.ver }}
        run: |
          # The rolling pre-release latest-main: deleted and made again on the newest commit.
          # Its name carries the version (Buddy Link shows it); never marked as latest.
          cat > notes.md <<EOF
          The newest build of \`main\` (${GITHUB_SHA::7}, version $VER), replaced on every push.
          Not a release: for trying changes before the next one. Buddy Link offers it as
          "Latest build from main" when flashing or updating; the setup page uses real releases.
          See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) under "Unreleased".
          EOF
          gh release delete latest-main --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-main dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Latest build from main ($VER)" --notes-file notes.md
