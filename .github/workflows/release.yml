name: release

# Push a tag like v0.1.0 to build all programs for all platforms and publish a GitHub
# release. deploy/proxmox/buddyd-lxc.sh downloads buddyd-linux-<arch> from the latest one.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test -count=1 ./...
      - name: build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            for cmd in buddyd buddyctl buddysim; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build -trimpath \
                -ldflags "-s -w -X main.version=$ver" -o "dist/$cmd-$os-$arch$ext" "./cmd/$cmd"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
