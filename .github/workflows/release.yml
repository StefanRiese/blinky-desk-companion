name: release

# Push a tag like v0.1.0 to build all programs for all platforms and publish a GitHub
# release. deploy/proxmox/buddyd-lxc.sh downloads buddyd-linux-<arch> from the latest one.
# Started by hand (Actions → release → Run workflow) it only builds and uploads the files
# as a workflow artifact, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: host/go.mod
          cache-dependency-path: host/go.sum
      - run: go test -count=1 ./...
      - name: build
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="0.0.0-dev+${GITHUB_SHA::7}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}" ext="" name="${target%/*}"
            [ "$os" = windows ] && ext=".exe"
            [ "$os" = darwin ] && name=macos # Go calls macOS "darwin"
            for cmd in buddyd buddyctl buddysim; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 go build -trimpath \
                -ldflags "-s -w -X main.version=$ver" -o "dist/$cmd-$name-$arch$ext" "./cmd/$cmd"
            done
          done
          # One file for Intel and Apple Silicon Macs (lipo only exists on macOS; makefat is
          # a pure-Go equivalent).
          for cmd in buddyd buddyctl buddysim; do
            go run github.com/randall77/makefat@v0.0.0-20260406194835-1b91746796b7 \
              "dist/$cmd-macos-universal" "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64"
            info="$(file "dist/$cmd-macos-universal")"
            echo "$info"
            grep -q "universal binary with 2 architectures" <<<"$info"
            rm "dist/$cmd-macos-amd64" "dist/$cmd-macos-arm64" # only the universal file is published
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: upload (test run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-test
          path: host/dist/
          retention-days: 7
      - name: publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release text: this tag's section of CHANGELOG.md, else GitHub's generated notes.
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p = ($2 == tag); next} p' ../CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Desk Buddy $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Desk Buddy $GITHUB_REF_NAME" --generate-notes
          fi
