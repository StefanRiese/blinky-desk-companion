name: pages

# Publishes site/ (the setup page) to GitHub Pages, with the firmware of the newest release
# that has one in site/firmware/ (ESP Web Tools fetches it from the page's own origin;
# release downloads can't be fetched cross-origin).
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml, "!**/*.md"] # Markdown alone: no run
  release:
    types: [published] # releases made by hand; the release workflow starts this one itself
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: firmware from the newest release that has one
        env:
          GH_TOKEN: ${{ github.token }}
        # One ESP Web Tools manifest per board (both are ESP32-S3, so ESP Web Tools can't tell
        # them apart; the page asks), and boards.json listing those the release has an image for.
        run: |
          tag=""
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --exclude-drafts --json tagName -q '.[].tagName'); do
            [ "$t" = latest-main ] && continue # the rolling build from main isn't for the setup page
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -q '^blinky-firmware-.*\.bin$'; then tag="$t"; break; fi
          done
          if [ -z "$tag" ]; then echo "no release with firmware yet: the page says so"; exit 0; fi
          pre=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          mkdir -p site/firmware
          list=""
          for entry in "ws146|Waveshare ESP32-S3-Touch-LCD-1.46" "amoled175|Waveshare ESP32-S3-Touch-AMOLED-1.75"; do
            board="${entry%%|*}"; name="${entry#*|}"; bin="blinky-firmware-$board.bin"
            echo "$assets" | grep -qx "$bin" || { echo "$tag has no $bin"; continue; }
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p "$bin" -D site/firmware
            # Split the image around the settings partitions (nvs, nvs_keys, from the partition
            # table inside it), so flashing an update keeps WiFi, rotation and the rest.
            parts=$(python3 - "site/firmware/$bin" "$board" <<'PY'
          import json, struct, sys
          path, board = sys.argv[1], sys.argv[2]
          img = open(path, "rb").read()
          skip = []
          for off in range(0x8000, 0x9000, 32):
              magic, typ, sub, start, size = struct.unpack_from("<HBBII", img, off)
              if magic != 0x50AA:
                  break
              if typ == 0x01 and sub in (0x02, 0x04):  # data: nvs, nvs_keys
                  skip.append((start, start + size))
          parts, pos = [], 0
          for start, end in sorted(skip) + [(len(img), len(img))]:
              if start > pos:
                  name = f"blinky-{board}-{pos:#x}.bin"
                  open(f"site/firmware/{name}", "wb").write(img[pos:min(start, len(img))])
                  parts.append({"path": name, "offset": pos})
              pos = max(pos, end)
          print(json.dumps(parts))
          PY
            )
            rm "site/firmware/$bin"
            cat > "site/firmware/manifest-$board.json" <<EOF
          {
            "name": "Blinky ($name)",
            "version": "${tag#v}",
            "prerelease": $pre,
            "new_install_prompt_erase": true,
            "builds": [{"chipFamily": "ESP32-S3", "parts": $parts}]
          }
          EOF
            list="$list${list:+,}{\"id\":\"$board\",\"name\":\"$name\",\"manifest\":\"manifest-$board.json\"}"
          done
          echo "{\"version\":\"${tag#v}\",\"prerelease\":$pre,\"boards\":[$list]}" > site/firmware/boards.json
          cat site/firmware/boards.json
          ls -la site/firmware
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
